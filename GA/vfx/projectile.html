<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Energy Orb VFX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #060612;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background: #0a0a1a;
            box-shadow: 0 12px 35px rgba(0,0,0,0.8), 0 0 20px rgba(80, 160, 255, 0.15);
            border: 3px solid #1a2a44;
            border-radius: 16px;
            cursor: pointer;
        }
        .info {
            margin-top: 14px;
            color: #7098cc;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <canvas id="vfxCanvas" width="800" height="500"></canvas>
    <div class="info">Click to fire — the hitbox rides the orb!</div>

<script>
const canvas = document.getElementById('vfxCanvas');
const ctx = canvas.getContext('2d');

const ORIGIN_X = 100;
const ORIGIN_Y = canvas.height / 2;

let projectiles = [];
let impactBursts = [];

// Hitbox target follows the mouse
let target = { x: 600, y: ORIGIN_Y };

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    target.x = e.clientX - rect.left;
    target.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    fire();
});

function projectileTravel(frame, reach) {
    const bt = Math.min(1, Math.max(0, frame / 18));
    return { bt, dist: bt * reach };
}

function projectileRadius(reach) {
    return Math.max(5, Math.min(18, reach * 0.12));
}

function fire() {
    projectiles.push({
        frame: 0,
        reach: 500,
        ox: ORIGIN_X,
        oy: ORIGIN_Y,
        angle: 0,
        alive: true,
    });
}

function update() {
    for (const p of projectiles) {
        if (!p.alive) continue;
        p.frame++;

        const { bt, dist } = projectileTravel(p.frame, p.reach);
        const rad = projectileRadius(p.reach);

        // Orb world position
        const orbX = p.ox + Math.cos(p.angle) * dist;
        const orbY = p.oy + Math.sin(p.angle) * dist;

        // Hitbox collision: circle at orb position with orb radius
        const dx = orbX - target.x;
        const dy = orbY - target.y;
        if (dx * dx + dy * dy <= rad * rad) {
            p.alive = false;
            // Spawn impact burst
            impactBursts.push({
                x: orbX, y: orbY,
                frame: 0,
                maxFrames: 16,
                radius: rad,
            });
            // Impact sparks
            for (let i = 0; i < 12; i++) {
                const a = Math.random() * Math.PI * 2;
                const spd = Math.random() * 6 + 2;
                impactBursts.push({
                    x: orbX, y: orbY,
                    vx: Math.cos(a) * spd,
                    vy: Math.sin(a) * spd,
                    frame: 0,
                    maxFrames: 10 + Math.random() * 8,
                    isSpark: true,
                    radius: 2,
                });
            }
        }

        // Kill if past full travel + linger
        if (bt >= 1 && p.frame > 60) {
            p.alive = false;
        }
    }

    // Age impact bursts
    for (let i = impactBursts.length - 1; i >= 0; i--) {
        impactBursts[i].frame++;
        if (impactBursts[i].isSpark) {
            impactBursts[i].x += impactBursts[i].vx;
            impactBursts[i].y += impactBursts[i].vy;
            impactBursts[i].vy += 0.15;
        }
        if (impactBursts[i].frame >= impactBursts[i].maxFrames) {
            impactBursts.splice(i, 1);
        }
    }

    // Clean dead projectiles
    projectiles = projectiles.filter(p => p.alive);
}

function render() {
    update();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background subtle glow at origin
    const bgGlow = ctx.createRadialGradient(ORIGIN_X, ORIGIN_Y, 0, ORIGIN_X, ORIGIN_Y, 120);
    bgGlow.addColorStop(0, 'rgba(80, 160, 255, 0.05)');
    bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Origin emitter dot
    ctx.beginPath();
    ctx.arc(ORIGIN_X, ORIGIN_Y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#88ccff';
    ctx.fill();

    // Hitbox target (dashed circle at mouse)
    ctx.save();
    ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(target.x, target.y, 18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(100, 180, 255, 0.08)';
    ctx.fill();
    ctx.restore();

    // Draw projectiles
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (const p of projectiles) {
        if (!p.alive) continue;
        const { bt, dist } = projectileTravel(p.frame, p.reach);
        const rad = projectileRadius(p.reach);

        // Orb position in world
        const orbX = p.ox + Math.cos(p.angle) * dist;
        const orbY = p.oy + Math.sin(p.angle) * dist;

        // Motion trail
        const trailLen = rad * 2.6;
        const trailGrad = ctx.createLinearGradient(orbX - trailLen, orbY, orbX, orbY);
        trailGrad.addColorStop(0, 'rgba(90,170,255,0)');
        trailGrad.addColorStop(0.6, 'rgba(150,220,255,0.5)');
        trailGrad.addColorStop(1, 'rgba(220,245,255,0.9)');
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = trailGrad;
        ctx.lineWidth = rad * 0.55;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(orbX - trailLen, orbY);
        ctx.lineTo(orbX, orbY);
        ctx.stroke();

        // The orb — bright core + blue halo with pulse
        const pulse = 0.85 + 0.15 * Math.sin(p.frame * 0.4);
        const core = ctx.createRadialGradient(orbX, orbY, 1, orbX, orbY, rad);
        core.addColorStop(0, 'rgba(255,255,255,0.98)');
        core.addColorStop(0.45, 'rgba(160,220,255,0.85)');
        core.addColorStop(1, 'rgba(70,140,255,0)');
        ctx.globalAlpha = pulse;
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(orbX, orbY, rad, 0, Math.PI * 2);
        ctx.fill();

        // Hitbox circle (rides the orb)
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = '#44ff88';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.arc(orbX, orbY, rad, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalCompositeOperation = 'lighter';
    }

    // Impact bursts
    for (const b of impactBursts) {
        const t = b.frame / b.maxFrames;
        if (b.isSpark) {
            ctx.globalAlpha = (1 - t) * 0.9;
            ctx.fillStyle = '#aaddff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        } else {
            const ir = b.radius * (1 + t * 2.5);
            ctx.globalAlpha = (1 - t) * 0.7;
            ctx.strokeStyle = 'rgba(180,225,255,0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(b.x, b.y, ir, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    ctx.restore();

    requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
