<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sword Counter FX</title>
<style>
:root{--bg:#f6f8fc;--fg:#12203a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--fg:#e6edff}}
:root[data-theme="dark"]{--bg:#0e1424;--fg:#e6edff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;opacity:.75;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">Tap / click / Space = red charges, blue blocks &amp; slashes · auto-replays</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,s,GY;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);s=Math.min(W/16,H/8);GY=H*.55}
addEventListener('resize',()=>{resize();reset()});resize();
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
let P=[],shake=0,freeze=0,state='idle',st=0,bx0=0,sw={a:2.9,a0:2.9,fade:0},ang=-2.4,sq=1,hit=false;
const B={x:0,y:0,r:0},E={x:0,y:0,vx:0,vy:0,r:0,rot:0,vr:0};
function reset(){state='idle';st=0;P=[];hit=false;B.r=E.r=s*.9;B.x=W*.25;E.x=W*.88;B.y=E.y=GY-B.r;E.vx=E.vy=E.rot=E.vr=0;ang=-2.4;sq=1;sw.fade=0}
reset();

/* ---------- FX spawners (reusable) ---------- */
function streak(x,y,a,len,w,col,life){P.push({t:'streak',x,y,a,len,w,col,life,max:life})}
function redTrail(x,y,a){ // a = direction of travel; streaks trail behind
  const back=a+Math.PI;
  for(let i=0;i<4;i++){const o=R(-.9,.9)*E.r,px=-Math.sin(a)*o,py=Math.cos(a)*o;
    streak(x+px,y+py,back,R(2,6)*s,R(.05,.2)*s,pick(['#ff3030','#ff3030','#ff7a7a','#111']),R(.18,.4))}
}
function blockFX(x,y){freeze=.04;shake=3;
  P.push({t:'barc',sm:1,x,y,life:.28,max:.28});
  for(let i=0;i<2;i++)P.push({t:'tick',x:x+R(.2,.7)*s,y:y-E.r*R(.9,1.3),a:-1.1+i*.6,life:.22,max:.22})}
function dots(x,y,n,m,cols){for(let i=0;i<n;i++){const a=R(-1.6,1.6),sp=R(.1,.38)*s;P.push({t:'dot',x,y,vx:Math.cos(a)*sp*m,vy:Math.sin(a)*sp-s*.06,r:R(.1,.24)*s,col:pick(cols),life:R(.4,.8),max:.8})}}
function hitFX(x,y){freeze=.09;shake=14;P.push({t:'star',x,y,life:.32,max:.32,rot:R(-.3,.3)});P.push({t:'ring',x,y,life:.4,max:.4});P.push({t:'barc',x,y,life:.35,max:.35});dots(x,y,9,1.4,['#fff','#9fe3ff','#ffd23a'])}

/* ---------- Flow ---------- */
function go(){if(state==='idle'){state='charge';st=0;E.vx=-s*.55}}
addEventListener('pointerdown',go);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();go()}});

function update(dt){
  const k=dt*60;st+=dt;shake*=Math.pow(.88,k);
  if(state==='idle'&&st>1)go();
  if(state==='charge'){
    E.x+=E.vx*k;redTrail(E.x,E.y,Math.PI);
    if(E.x-E.r<=B.x+B.r*1.7){state='block';st=0;E.vx=0;bx0=B.x;blockFX(E.x-E.r*.9,E.y-E.r*.1)}
  }else if(state==='block'){
    if(Math.random()<.4)redTrail(E.x,E.y,Math.PI);
    const q=cl((st-.12)/.16);ang=-2.4-.98*q;sq=1-.28*q;
    if(st>.3){state='slash';st=0;sw.fade=1;hit=false}
  }else if(state==='slash'){
    const u=cl(st/.28),e=1-Math.pow(1-u,2.5);
    ang=2.9-2.7*e;sw.a=ang;B.x=bx0+s*.9*e;
    if(u>.6&&!hit){hit=true;E.vx=s*.5;E.vy=-s*.34;E.vr=.3;hitFX(E.x-E.r*.2,E.y+E.r*.4)}
    if(hit){E.x+=E.vx*k;E.y+=E.vy*k;E.vy+=s*.006*k;E.rot+=E.vr*k;redTrail(E.x,E.y,Math.atan2(E.vy,E.vx))}
    if(u>=1)sw.fade=Math.max(0,sw.fade-dt*3.5);
    if(st>1.8)reset();
  }
  for(const p of P){p.life-=dt;if(p.t==='dot'){p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.014*s*k}}
  P=P.filter(p=>p.life>0);
}

/* ---------- Drawing ---------- */
const lw=()=>s*.11;
function poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}
function ball(x,y,r,c1,c2){const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=lw();ctx.strokeStyle='#000';ctx.stroke();ctx.beginPath();ctx.ellipse(x-r*.4,y-r*.52,r*.26,r*.12,-.6,0,7);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill()}
function eyeAngry(x,y,r,d=1){ctx.save();ctx.translate(x,y);ctx.scale(r*d,r);ctx.beginPath();
  ctx.moveTo(-.3,-.02);ctx.lineTo(.3,.15);ctx.quadraticCurveTo(.25,.55,-.05,.5);ctx.quadraticCurveTo(-.38,.35,-.3,-.02);
  ctx.fillStyle='#fff';ctx.fill();ctx.restore();ctx.lineWidth=lw()*.45;ctx.strokeStyle='#000';ctx.stroke()}
function chevron(x,y,r,d){ctx.beginPath();ctx.moveTo(x-d*r*.2,y-r*.2);ctx.lineTo(x+d*r*.2,y);ctx.lineTo(x-d*r*.2,y+r*.2);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.lineWidth=r*.3;ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=r*.15;ctx.stroke()}
function shield(x,y,h){const path=k=>{ctx.beginPath();ctx.moveTo(-.4*k,-1*k);ctx.lineTo(.45*k,-.65*k);ctx.lineTo(.6*k,.15*k);ctx.lineTo(.05*k,1*k);ctx.lineTo(-.4*k,.8*k);ctx.closePath()};
  ctx.save();ctx.translate(x,y);ctx.scale(h,h);ctx.lineJoin='round';path(1);ctx.fillStyle='#f5b928';ctx.fill();ctx.lineWidth=.1;ctx.strokeStyle='#000';ctx.stroke();
  path(.78);const g=ctx.createLinearGradient(-.3,-.8,.4,.8);g.addColorStop(0,'#1aa0ff');g.addColorStop(1,'#0a4fe0');ctx.fillStyle=g;ctx.fill();
  poly([[.15,-.4],[.22,-.05],[.52,.05],[.22,.15],[.12,.55],[.04,.15],[-.25,.05],[.04,-.05]]);ctx.fillStyle='#ffc933';ctx.fill();ctx.restore()}
function sword(x,y,a,L){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.lineJoin='round';ctx.lineWidth=s*.07;ctx.strokeStyle='#000';
  const g=ctx.createLinearGradient(0,-L*.07,0,L*.07);g.addColorStop(0,'#e6f0ff');g.addColorStop(1,'#7f9fe0');
  poly([[.16*L,-.08*L],[.92*L,-.08*L],[L,0],[.92*L,.08*L],[.16*L,.08*L]]);ctx.fillStyle=g;ctx.fill();ctx.stroke();
  ctx.fillStyle='#f5b928';ctx.beginPath();ctx.roundRect(.1*L,-.17*L,.07*L,.34*L,s*.05);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect(-.08*L,-.05*L,.18*L,.1*L,s*.05);ctx.fill();ctx.stroke();ctx.restore()}
function swoosh(px,py,L){const a0=sw.a0,a1=sw.a,n=30;ctx.save();ctx.globalAlpha=Math.min(1,sw.fade*1.5);
  [['#1f78ff',1],['#5cc0ff',.62],['#ffffff',.28]].forEach(([c,m])=>{const o=[],q=[];
    for(let i=0;i<=n;i++){const f=i/n,a=a0+(a1-a0)*f,w=s*.9*m*Math.sin(Math.PI*Math.pow(f,1.8)),r=L*.95;
      o.push([px+Math.cos(a)*(r+w*.5),py+Math.sin(a)*(r+w*.5)]);q.push([px+Math.cos(a)*(r-w*.5),py+Math.sin(a)*(r-w*.5)])}
    poly(o.concat(q.reverse()));ctx.fillStyle=c;ctx.fill()});ctx.restore()}
function drawP(p){const f=Math.max(0,p.life/p.max);ctx.save();
  if(p.t==='streak'){ctx.globalAlpha=Math.min(1,f*2);ctx.fillStyle=p.col;const c=Math.cos(p.a),n=Math.sin(p.a),px=-n*p.w/2,py=c*p.w/2;
    poly([[p.x+px,p.y+py],[p.x+c*p.len,p.y+n*p.len],[p.x-px,p.y-py]]);ctx.fill()}
  else if(p.t==='barc'){const e=1-f,rad=s*(p.sm?1.3+e*.9:1.6+e*2.2),cx=p.x-rad*.8;ctx.globalAlpha=Math.min(1,f*2)*(p.sm?.7:1);
    ctx.beginPath();ctx.arc(cx,p.y,rad,-1,1);ctx.arc(cx+rad*.3,p.y,rad*.9,1,-1,true);ctx.closePath();ctx.fillStyle='#6cc8ff';ctx.fill();
    if(!p.sm){ctx.beginPath();ctx.arc(cx,p.y,rad*.97,-.9,.9);ctx.arc(cx+rad*.12,p.y,rad*.9,.9,-.9,true);ctx.closePath();ctx.fillStyle='#e4f6ff';ctx.fill()}}
  else if(p.t==='tick'){ctx.globalAlpha=Math.min(1,f*3);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(p.a)*s*.7,p.y+Math.sin(p.a)*s*.7);
    ctx.lineCap='round';ctx.lineWidth=s*.1;ctx.strokeStyle='#000';ctx.stroke()}
  else if(p.t==='star'){const e=1-f,sc=s*(.5+Math.sin(Math.min(1,e*1.6)*1.57)*1.3)*(f>.25?1:f/.25);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    const pts=[];for(let i=0;i<20;i++){const a=i/20*6.283,rr=i%2?sc*.5:sc*(i%4?1.25:.85);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}
    poly(pts);ctx.fillStyle='#ffd23a';ctx.fill();ctx.lineJoin='round';ctx.lineWidth=s*.09;ctx.strokeStyle='#000';ctx.stroke();ctx.scale(.55,.55);poly(pts);ctx.fillStyle='#fffbe0';ctx.fill()}
  else if(p.t==='ring'){const e=1-f,r=s*(.8+e*2.6);ctx.globalAlpha=Math.min(1,f*2);ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.lineWidth=s*(.28*f+.05);ctx.strokeStyle='#000';ctx.stroke();ctx.lineWidth=s*.16*f+1;ctx.strokeStyle='#fff';ctx.stroke()}
  else if(p.t==='dot'){ctx.globalAlpha=Math.min(1,f*2.5);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=p.col;ctx.fill();ctx.lineWidth=s*.05;ctx.strokeStyle='#000';ctx.stroke()}
  ctx.restore()}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.save();if(shake>.3)ctx.translate(R(-shake,shake),R(-shake,shake));
  ctx.fillStyle='rgba(60,70,120,.18)';ctx.beginPath();ctx.ellipse(B.x,GY+s*.12,B.r*1.5,s*.16,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(state==='charge'||state==='block'?E.x:E.x,GY+s*.12+(hit?s*.5:0),E.r*1.1,s*.14,0,0,7);ctx.globalAlpha=hit?.5:1;ctx.fill();ctx.globalAlpha=1;
  P.filter(p=>p.t==='streak').forEach(drawP);
  // blue (squashed from ground)
  ctx.save();ctx.translate(0,GY);ctx.scale(1,sq);ctx.translate(0,-GY);
  ball(B.x,B.y,B.r,'#2a8bff','#0846c9');eyeAngry(B.x+B.r*.12,B.y+B.r*.12,B.r*.5);eyeAngry(B.x+B.r*.72,B.y+B.r*.08,B.r*.4);
  const px=B.x-B.r*.45,py=B.y+B.r*.45,L=B.r*2.3;sword(px,py,ang,L);shield(B.x+B.r*.8,B.y,B.r*1.05);
  if(sw.fade>0)swoosh(px,py,L);ctx.restore();
  // red
  ctx.save();ctx.translate(E.x,E.y);if(state==='charge'||hit){const va=Math.atan2(E.vy,E.vx);ctx.rotate(va);ctx.scale(1.22,.86);ctx.rotate(E.rot-va)}else ctx.rotate(E.rot);ball(0,0,E.r,'#ff4a3d','#a30f17');
  if(hit){chevron(-E.r*.05,-E.r*.38,E.r,1);chevron(E.r*.35,-E.r*.02,E.r,-1)}
  else{eyeAngry(-E.r*.35,E.r*.02,E.r*.55,-1);eyeAngry(-E.r*.85,E.r*.05,E.r*.4,-1)}
  ctx.restore();
  P.filter(p=>p.t!=='streak').forEach(drawP);ctx.restore()}
let last=performance.now();
(function loop(n){let dt=Math.min((n-last)/1000,.05);last=n;if(freeze>0){freeze-=dt;dt*=.05}update(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
