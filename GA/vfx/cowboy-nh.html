<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polished Muzzle Flash & Bullet VFX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0914;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            background: #141124;
            box-shadow: 0 12px 35px rgba(0,0,0,0.8), 0 0 15px rgba(255, 170, 0, 0.15);
            border: 3px solid #2a2444;
            border-radius: 16px;
            cursor: pointer;
        }
        .info {
            margin-top: 14px;
            color: #a098c4;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <canvas id="vfxCanvas" width="800" height="500"></canvas>
    <div class="info">Click anywhere to fire!</div>

<script>
const canvas = document.getElementById('vfxCanvas');
const ctx = canvas.getContext('2d');

const CENTER_X = canvas.width / 2;
const CENTER_Y = canvas.height / 2;

let bullets = [];
let muzzleFlashes = [];
let smokeParticles = [];
let sparks = [];
let shockwaves = [];
let casings = [];

// Screen Shake intensity
let shakeTime = 0;

// Hitbox collision target (click to reposition)
let target = { x: CENTER_X + 300, y: CENTER_Y };

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    target.x = e.clientX - rect.left;
    target.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    shoot();
});

function shoot() {
    // Trigger Screen Shake
    shakeTime = 5;

    // 1. Launch Bullet (shifted 50px right)
    bullets.push({
        x: CENTER_X + 50,
        y: CENTER_Y,
        vx: 24,
        length: 32,
        radius: 6
    });

    // 2. Spawn Muzzle Flash (shifted 50px right)
    muzzleFlashes.push({
        x: CENTER_X + 50,
        y: CENTER_Y,
        scale: 1.0,
        alpha: 1.0,
        rotation: Math.random() * Math.PI,
        life: 0,
        maxLife: 7
    });

    // 3. Shockwave Ring (shifted 50px right)
    shockwaves.push({
        x: CENTER_X + 50,
        y: CENTER_Y,
        radius: 10,
        maxRadius: 60,
        alpha: 1.0,
        life: 0,
        maxLife: 10
    });

    // 4. Eject Shell Casing (fewer casings, shifted 50px right)
    casings.push({
        x: CENTER_X + 50 - 10,
        y: CENTER_Y,
        vx: -(Math.random() * 3 + 4),
        vy: -(Math.random() * 4 + 3),
        rotation: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.4,
        alpha: 1.0,
        life: 0,
        maxLife: 28
    });

    // 5. Fast Hot Sparks (reduced from 18 to 11, shifted 50px right)
    for (let i = 0; i < 11; i++) {
        const angle = (Math.random() - 0.5) * Math.PI * 0.5; // Narrow forward cone
        const speed = Math.random() * 12 + 4;
        sparks.push({
            x: CENTER_X + 50,
            y: CENTER_Y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            length: Math.random() * 12 + 6,
            color: Math.random() > 0.4 ? '#ffaa00' : '#ff4400',
            alpha: 1.0,
            life: 0,
            maxLife: 12 + Math.random() * 8
        });
    }

    // 6. Volumetric Smoke (reduced from 12 to 7, shifted 50px right)
    for (let i = 0; i < 7; i++) {
        const angle = (Math.random() - 0.5) * Math.PI * 0.7;
        const speed = Math.random() * 6 + 2;
        smokeParticles.push({
            x: CENTER_X + 50,
            y: CENTER_Y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 6 + 4,
            alpha: 0.8,
            life: 0,
            maxLife: 20 + Math.random() * 12
        });
    }
}

function drawMuzzleFlash(flash) {
    ctx.save();
    ctx.translate(flash.x, flash.y);
    ctx.rotate(flash.rotation);
    ctx.globalAlpha = flash.alpha;

    // Glowing Radial Outer Flare
    const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, 55 * flash.scale);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.3, 'rgba(255, 180, 0, 0.8)');
    grad.addColorStop(0.7, 'rgba(255, 60, 0, 0.3)');
    grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 55 * flash.scale, 0, Math.PI * 2);
    ctx.fill();

    // Outer Yellow Flash Star
    ctx.beginPath();
    const outerSpikes = 8;
    for (let i = 0; i < outerSpikes * 2; i++) {
        const r = (i % 2 === 0) ? 42 * flash.scale : 12 * flash.scale;
        const angle = (i * Math.PI) / outerSpikes;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffcc00';
    ctx.fill();

    // Inner Hot Core Star
    ctx.beginPath();
    const innerSpikes = 6;
    for (let i = 0; i < innerSpikes * 2; i++) {
        const r = (i % 2 === 0) ? 22 * flash.scale : 6 * flash.scale;
        const angle = (i * Math.PI) / innerSpikes;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.restore();
}

function update() {
    // Screen Shake decay
    if (shakeTime > 0) shakeTime--;

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        // Hitbox collision: check if bullet overlaps target
        const dx = b.x - target.x;
        const dy = b.y - target.y;
        if (Math.hypot(dx, dy) < b.radius + 18) {
            // Hit! Spawn impact sparks and remove bullet
            for (let j = 0; j < 10; j++) {
                const a = Math.random() * Math.PI * 2;
                const spd = Math.random() * 8 + 3;
                sparks.push({
                    x: b.x, y: b.y,
                    vx: Math.cos(a) * spd,
                    vy: Math.sin(a) * spd,
                    length: Math.random() * 10 + 5,
                    color: '#ffdd44',
                    alpha: 1.0,
                    life: 0,
                    maxLife: 10 + Math.random() * 6
                });
            }
            // Impact shockwave
            shockwaves.push({
                x: b.x, y: b.y,
                radius: 8,
                maxRadius: 50,
                alpha: 1.0,
                life: 0,
                maxLife: 8
            });
            bullets.splice(i, 1);
            continue;
        }
        if (b.x > canvas.width + 100) bullets.splice(i, 1);
    }

    // Flash
    for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        let f = muzzleFlashes[i];
        f.life++;
        f.alpha = 1 - f.life / f.maxLife;
        f.scale += 0.15;
        if (f.life >= f.maxLife) muzzleFlashes.splice(i, 1);
    }

    // Shockwaves
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        let w = shockwaves[i];
        w.life++;
        w.radius += (w.maxRadius - w.radius) * 0.25;
        w.alpha = 1 - w.life / w.maxLife;
        if (w.life >= w.maxLife) shockwaves.splice(i, 1);
    }

    // Sparks
    for (let i = sparks.length - 1; i >= 0; i--) {
        let s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.15; // Soft gravity
        s.vx *= 0.95;
        s.life++;
        s.alpha = 1 - s.life / s.maxLife;
        if (s.life >= s.maxLife) sparks.splice(i, 1);
    }

    // Casings
    for (let i = casings.length - 1; i >= 0; i--) {
        let c = casings[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.35; // Gravity pull on casing
        c.rotation += c.vRot;
        c.life++;
        c.alpha = 1 - c.life / c.maxLife;
        if (c.life >= c.maxLife) casings.splice(i, 1);
    }

    // Smoke
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
        let p = smokeParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.90;
        p.vy *= 0.90;
        p.life++;
        p.radius += 0.4;
        p.alpha = (1 - p.life / p.maxLife) * 0.6;
        if (p.life >= p.maxLife) smokeParticles.splice(i, 1);
    }
}

function render() {
    update();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    // Apply Screen Shake Camera Translation
    if (shakeTime > 0) {
        const rx = (Math.random() - 0.5) * shakeTime * 2.5;
        const ry = (Math.random() - 0.5) * shakeTime * 2.5;
        ctx.translate(rx, ry);
    }

    // Subtle Radial Glow at Center Source
    const bgGlow = ctx.createRadialGradient(CENTER_X, CENTER_Y, 0, CENTER_X, CENTER_Y, 200);
    bgGlow.addColorStop(0, 'rgba(255, 170, 0, 0.06)');
    bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Center Emitter Dot
    ctx.beginPath();
    ctx.arc(CENTER_X, CENTER_Y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffaa00';
    ctx.fill();

    // Hitbox collision target (visual)
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 170, 0, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(target.x, target.y, 18, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 170, 0, 0.08)';
    ctx.fill();
    ctx.restore();

    // --- 1. SHOCKWAVE RINGS ---
    shockwaves.forEach(w => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = `rgba(255, 200, 100, ${w.alpha * 0.7})`;
        ctx.stroke();
        ctx.restore();
    });

    // --- 2. SHELL CASINGS ---
    casings.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rotation);
        ctx.globalAlpha = c.alpha;
        ctx.fillStyle = '#ffcc00';
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        ctx.fillRect(-6, -2.5, 12, 5);
        ctx.strokeRect(-6, -2.5, 12, 5);
        ctx.restore();
    });

    // --- 3. SMOKE PARTICLES ---
    smokeParticles.forEach(p => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(160, 150, 180, ${p.alpha})`;
        ctx.fill();
        ctx.restore();
    });

    // --- 4. BULLETS (Gradient Energy Trails) ---
    bullets.forEach(b => {
        ctx.save();
        
        // Motion Gradient Trail
        const trailGrad = ctx.createLinearGradient(b.x - b.length * 2.5, b.y, b.x, b.y);
        trailGrad.addColorStop(0, 'rgba(255, 60, 0, 0)');
        trailGrad.addColorStop(0.6, 'rgba(255, 150, 0, 0.5)');
        trailGrad.addColorStop(1, 'rgba(255, 255, 200, 1)');

        ctx.beginPath();
        ctx.moveTo(b.x - b.length * 2.5, b.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineWidth = b.radius * 2;
        ctx.strokeStyle = trailGrad;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Bullet Head
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, Math.PI * 0.5, Math.PI * 1.5, true);
        ctx.lineTo(b.x - b.length, b.y - b.radius);
        ctx.lineTo(b.x - b.length, b.y + b.radius);
        ctx.closePath();
        ctx.fillStyle = '#ffea78';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#331100';
        ctx.stroke();

        ctx.restore();
    });

    // --- 5. HIGH-HEAT SPARKS (Additive Blending) ---
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    sparks.forEach(s => {
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.vx * 1.5, s.y - s.vy * 1.5);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = s.color;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();
    });
    ctx.restore();

    // --- 6. MUZZLE FLASH ---
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    muzzleFlashes.forEach(f => drawMuzzleFlash(f));
    ctx.restore();

    ctx.restore();

    requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
