<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Impact Pillar VFX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #12100e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }
        canvas {
            background: #1e1915;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            border: 4px solid #3d322a;
            border-radius: 16px;
            cursor: pointer;
        }
        .info {
            margin-top: 12px;
            color: #d4c5b9;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
        }
    </style>
</head>
<body>

    <canvas id="vfxCanvas" width="800" height="500"></canvas>
    <div class="info">Click anywhere to launch the impact pillar!</div>

<script>
const canvas = document.getElementById('vfxCanvas');
const ctx = canvas.getContext('2d');

const CENTER_X = canvas.width / 2;
const CENTER_Y = canvas.height / 2;
const FLOOR_Y = 430;

let bullets = [];
let muzzleFlashes = [];
let pillars = [];
let sparks = [];
let smokeParticles = [];
let shockwaves = [];

canvas.addEventListener('mousedown', () => {
    shootDownward();
});

function shootDownward() {
    // Muzzle flash at screen center
    muzzleFlashes.push({
        x: CENTER_X,
        y: CENTER_Y,
        scale: 0.8,
        alpha: 1.0,
        life: 0,
        maxLife: 5
    });

    // Bullet towards floor
    bullets.push({
        x: CENTER_X,
        y: CENTER_Y,
        vy: 26,
        length: 24,
        radius: 5
    });
}

function triggerFloorImpact(x, y) {
    // 1. Rising Energy/Fire Pillar
    pillars.push({
        x: x,
        y: y,
        height: 0,
        maxHeight: 180, // Height of the pillar
        width: 35,
        alpha: 1.0,
        life: 0,
        maxLife: 16
    });

    // 2. Expanding Ground Shockwave
    shockwaves.push({
        x: x,
        y: y,
        radius: 6,
        maxRadius: 70,
        alpha: 1.0,
        life: 0,
        maxLife: 14
    });

    // 3. Dense Upward Sparks (35 particles)
    for (let i = 0; i < 35; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * (Math.PI * 0.5); // Narrow upward cone
        const speed = Math.random() * 12 + 4;
        sparks.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 4 + 2,
            color: Math.random() > 0.4 ? '#ffcc00' : (Math.random() > 0.5 ? '#ff4400' : '#ffffff'),
            alpha: 1.0,
            life: 0,
            maxLife: 18 + Math.random() * 14
        });
    }

    // 4. Heavy Rising Smoke Clouds (15 particles)
    for (let i = 0; i < 15; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * (Math.PI * 0.7);
        const speed = Math.random() * 6 + 2;
        smokeParticles.push({
            x: x + (Math.random() - 0.5) * 15,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 8 + 6,
            alpha: 0.9,
            life: 0,
            maxLife: 25 + Math.random() * 15
        });
    }
}

// Draw the Rising Energy/Fire Pillar Effect
function drawPillar(p) {
    ctx.save();
    ctx.globalAlpha = p.alpha;

    const topY = p.y - p.height;

    // Outer Glow Beam
    ctx.beginPath();
    ctx.moveTo(p.x - p.width, p.y);
    ctx.lineTo(p.x - p.width * 0.4, topY);
    ctx.lineTo(p.x + p.width * 0.4, topY);
    ctx.lineTo(p.x + p.width, p.y);
    ctx.closePath();
    ctx.fillStyle = '#ff6600';
    ctx.fill();

    // Inner Fire Pillar
    ctx.beginPath();
    ctx.moveTo(p.x - p.width * 0.6, p.y);
    ctx.lineTo(p.x - p.width * 0.2, topY + 10);
    ctx.lineTo(p.x + p.width * 0.2, topY + 10);
    ctx.lineTo(p.x + p.width * 0.6, p.y);
    ctx.closePath();
    ctx.fillStyle = '#ffcc00';
    ctx.fill();

    // Hot White Core Beam
    ctx.beginPath();
    ctx.moveTo(p.x - p.width * 0.25, p.y);
    ctx.lineTo(p.x - p.width * 0.05, topY + 25);
    ctx.lineTo(p.x + p.width * 0.05, topY + 25);
    ctx.lineTo(p.x + p.width * 0.25, p.y);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Toon Outline
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#222222';
    ctx.strokeRect(p.x - p.width * 0.5, topY, p.width, p.height);

    ctx.restore();
}

function update() {
    // 1. Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y += b.vy;

        if (b.y >= FLOOR_Y) {
            triggerFloorImpact(b.x, FLOOR_Y);
            bullets.splice(i, 1);
        }
    }

    // 2. Muzzle Flashes
    for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        let f = muzzleFlashes[i];
        f.life++;
        f.alpha = 1 - f.life / f.maxLife;
        f.scale += 0.15;
        if (f.life >= f.maxLife) {
            muzzleFlashes.splice(i, 1);
        }
    }

    // 3. Impact Pillars
    for (let i = pillars.length - 1; i >= 0; i--) {
        let p = pillars[i];
        p.life++;
        
        // Rapid upward shoot up
        if (p.height < p.maxHeight) {
            p.height += (p.maxHeight - p.height) * 0.55;
        }
        
        p.alpha = 1 - p.life / p.maxLife;
        if (p.life >= p.maxLife) {
            pillars.splice(i, 1);
        }
    }

    // 4. Ground Shockwaves
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        let w = shockwaves[i];
        w.life++;
        w.radius += (w.maxRadius - w.radius) * 0.25;
        w.alpha = 1 - w.life / w.maxLife;
        if (w.life >= w.maxLife) {
            shockwaves.splice(i, 1);
        }
    }

    // 5. Upward Sparks
    for (let i = sparks.length - 1; i >= 0; i--) {
        let p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2; // Gravity
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.life++;
        p.alpha = 1 - p.life / p.maxLife;

        if (p.life >= p.maxLife) {
            sparks.splice(i, 1);
        }
    }

    // 6. Smoke Clouds
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
        let s = smokeParticles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.92;
        s.vy *= 0.92;
        s.life++;
        s.radius += 0.4;
        s.alpha = 1 - s.life / s.maxLife;

        if (s.life >= s.maxLife) {
            smokeParticles.splice(i, 1);
        }
    }
}

function render() {
    update();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Floor Line
    ctx.beginPath();
    ctx.moveTo(0, FLOOR_Y);
    ctx.lineTo(canvas.width, FLOOR_Y);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#3d322a';
    ctx.stroke();

    // Center Source Point
    ctx.beginPath();
    ctx.arc(CENTER_X, CENTER_Y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffaa00';
    ctx.fill();

    // Ground Shockwaves
    shockwaves.forEach(w => {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(w.x, w.y, w.radius, w.radius * 0.28, 0, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = `rgba(255, 170, 0, ${w.alpha})`;
        ctx.stroke();
        ctx.restore();
    });

    // Bullets
    bullets.forEach(b => {
        ctx.save();

        // Trail
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - b.length * 1.5);
        ctx.lineTo(b.x, b.y);
        ctx.lineWidth = b.radius * 2;
        ctx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
        ctx.stroke();

        // Bullet Head
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, Math.PI, 0, true);
        ctx.lineTo(b.x + b.radius, b.y - b.length);
        ctx.lineTo(b.x - b.radius, b.y - b.length);
        ctx.closePath();
        ctx.fillStyle = '#ffaa00';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#222';
        ctx.stroke();

        ctx.restore();
    });

    // Smoke Clouds
    smokeParticles.forEach(s => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(160, 140, 130, ${s.alpha * 0.5})`;
        ctx.fill();
        ctx.restore();
    });

    // Muzzle Flashes
    muzzleFlashes.forEach(f => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.globalAlpha = f.alpha;
        ctx.beginPath();
        const spikes = 8;
        for (let i = 0; i < spikes * 2; i++) {
            const r = (i % 2 === 0) ? 28 * f.scale : 8 * f.scale;
            const angle = (i * Math.PI) / spikes;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = '#ffaa00';
        ctx.fill();
        ctx.restore();
    });

    // Impact Pillars
    pillars.forEach(p => drawPillar(p));

    // High-Velocity Sparks
    sparks.forEach(p => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, p.radius * (1 - p.life / p.maxLife)), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.restore();
    });

    requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
