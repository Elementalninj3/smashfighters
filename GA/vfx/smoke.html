<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toony Grey Smoke Bomb Effect</title>
    <!-- Tailwind CSS for modern reset and full-screen container -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overflow: hidden;
            background: #111827; /* Dark modern background to make grey smoke pop */
            user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="w-screen h-screen">

    <canvas id="smokeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('smokeCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;

        // High-DPI handling for crystal sharp comic outlines
        const dpr = window.devicePixelRatio || 1;
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class ShockwaveRing {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = 130 + Math.random() * 40;
                this.life = 1.0;
                this.decay = 0.05;
                this.lineWidth = 5;
            }

            update(dt) {
                this.radius += (this.maxRadius - this.radius) * 0.25 * (dt * 60);
                this.life -= this.decay * (dt * 60);
            }

            draw(context) {
                if (this.life <= 0) return;
                context.save();
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.strokeStyle = `rgba(209, 213, 219, ${this.life * 0.8})`; // Light grey shockwave ring
                context.lineWidth = this.lineWidth * this.life;
                context.stroke();
                context.restore();
            }
        }

        class SmokePuff {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                
                // Explode outward with randomized speeds and angles
                const angle = Math.random() * Math.PI * 2;
                const speed = 2.5 + Math.random() * 6.5;
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 1.5; // Upward drift
                
                this.life = 1.0;
                this.decay = 0.015 + Math.random() * 0.015;
                
                this.targetRadius = 22 + Math.random() * 28;
                this.currentRadius = 4; // Pop-in squash effect
                
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.04;

                // Authentic toon grey smoke shades with bold dark outlines
                const greyShades = [
                    { fill: '#f3f4f6', stroke: '#1f2937' }, // Very light silver grey / dark slate outline
                    { fill: '#e5e7eb', stroke: '#111827' }, // Soft cool grey / near black outline
                    { fill: '#d1d5db', stroke: '#1f2937' }, // Classic neutral grey
                    { fill: '#9ca3af', stroke: '#111827' }  // Medium charcoal grey
                ];
                this.palette = greyShades[Math.floor(Math.random() * greyShades.length)];
                
                // Construct distinct, non-overlapping puffy perimeter bubbles
                this.bubbles = [];
                // 4 to 6 separate outer puffs arranged in a clean non-overlapping rosette ring
                const numBubbles = 4 + Math.floor(Math.random() * 3);
                const baseDist = 0.55; // Distance from center so they stand apart clearly
                
                for (let i = 0; i < numBubbles; i++) {
                    const bubbleAngle = (i / numBubbles) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
                    this.bubbles.push({
                        angle: bubbleAngle,
                        dist: this.targetRadius * baseDist,
                        radius: this.targetRadius * 0.42 // Sized perfectly to avoid muddy clumping
                    });
                }
            }

            update(dt) {
                // Smooth spring scale up
                this.currentRadius += (this.targetRadius - this.currentRadius) * 0.2 * (dt * 60);

                // Apply velocity with drag
                this.x += this.vx * (dt * 60);
                this.y += this.vy * (dt * 60);
                this.vx *= Math.pow(0.86, dt * 60);
                this.vy *= Math.pow(0.86, dt * 60);
                this.vy -= 0.04 * (dt * 60); // Buoyancy

                this.rotation += this.rotationSpeed * (dt * 60);
                this.life -= this.decay * (dt * 60);
            }

            draw(context) {
                if (this.life <= 0) return;

                context.save();
                context.translate(this.x, this.y);
                context.rotate(this.rotation);

                const alpha = Math.max(0, this.life);
                context.fillStyle = this.toRgba(this.palette.fill, alpha * 0.95);
                context.strokeStyle = this.toRgba(this.palette.stroke, alpha);
                context.lineWidth = 4; // Bold cartoon comic book outline
                context.lineJoin = 'round';
                context.lineCap = 'round';

                // Draw each distinct puffy cloud circle individually without heavy overlapping inner clutter
                const scaleFactor = this.currentRadius / this.targetRadius;

                for (let b of this.bubbles) {
                    const bx = Math.cos(b.angle) * b.dist * scaleFactor;
                    const by = Math.sin(b.angle) * b.dist * scaleFactor;
                    const br = b.radius * scaleFactor;

                    context.beginPath();
                    context.arc(bx, by, br, 0, Math.PI * 2);
                    context.fill();
                    context.stroke();
                }

                context.restore();
            }

            toRgba(hex, alpha) {
                let c = hex.replace('#', '');
                if (c.length === 3) c = c.split('').map(char => char + char).join('');
                const num = parseInt(c, 16);
                return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
            }
        }

        class Sparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = 4 + Math.random() * 7;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = 0.04 + Math.random() * 0.03;
                this.size = 8 + Math.random() * 10;
                this.rotation = Math.random() * Math.PI;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
                
                const sparkColors = ['#f3f4f6', '#e5e7eb', '#9ca3af', '#ffffff'];
                this.color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
            }

            update(dt) {
                this.x += this.vx * (dt * 60);
                this.y += this.vy * (dt * 60);
                this.vx *= Math.pow(0.84, dt * 60);
                this.vy *= Math.pow(0.84, dt * 60);
                this.rotation += this.rotSpeed * (dt * 60);
                this.life -= this.decay * (dt * 60);
            }

            draw(context) {
                if (this.life <= 0) return;
                context.save();
                context.translate(this.x, this.y);
                context.rotate(this.rotation);
                
                const scale = this.life * (0.8 + 0.2 * Math.sin(this.life * 12));
                context.fillStyle = this.color;
                context.strokeStyle = '#111827';
                context.lineWidth = 2.5;

                // 4-point cartoon star shape
                context.beginPath();
                for (let i = 0; i < 4; i++) {
                    context.lineTo(0, -this.size * scale);
                    context.rotate(Math.PI / 4);
                    context.lineTo(0, -this.size * 0.35 * scale);
                    context.rotate(Math.PI / 4);
                }
                context.closePath();
                context.fill();
                context.stroke();
                context.restore();
            }
        }

        let shockwaves = [];
        let particles = [];
        let sparkles = [];

        function triggerSmokeBomb(x, y) {
            shockwaves.push(new ShockwaveRing(x, y));

            // Generate precise count of non-overlapping puffy grey smoke clouds
            const puffCount = 16 + Math.floor(Math.random() * 5);
            for (let i = 0; i < puffCount; i++) {
                particles.push(new SmokePuff(
                    x + (Math.random() - 0.5) * 15,
                    y + (Math.random() - 0.5) * 15
                ));
            }

            // Generate crisp star sparks
            const sparkleCount = 8 + Math.floor(Math.random() * 4);
            for (let i = 0; i < sparkleCount; i++) {
                sparkles.push(new Sparkle(x, y));
            }
        }

        window.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            triggerSmokeBomb(x, y);
        });

        let lastTime = performance.now();

        function animate(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            ctx.clearRect(0, 0, width, height);

            // Update & render shockwaves
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                shockwaves[i].update(dt);
                shockwaves[i].draw(ctx);
                if (shockwaves[i].life <= 0) shockwaves.splice(i, 1);
            }

            // Update & render grey smoke puffs
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                particles[i].draw(ctx);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Update & render star sparkles
            for (let i = sparkles.length - 1; i >= 0; i--) {
                sparkles[i].update(dt);
                sparkles[i].draw(ctx);
                if (sparkles[i].life <= 0) sparkles.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }

        // Trigger initial welcoming smoke puff in center on startup
        setTimeout(() => {
            triggerSmokeBomb(width / 2, height / 2);
        }, 300);

        requestAnimationFrame(animate);
    </script>
</body>
</html>
