<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hook Swing VFX</title>
<style>
:root{--bg:#20252c;--ui:#eef3fa;--ui-bg:rgba(18,22,28,.78);--ui-line:rgba(255,255,255,.16);--acc:#8fd3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1f}}
:root[data-theme="dark"]{--bg:#171a1f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ui);font:13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:var(--ui);background:var(--ui-bg);border:1px solid var(--ui-line);border-radius:999px;padding:8px 16px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="rp">Replay</button>
  <button id="lp" aria-pressed="true">Loop</button>
  <button id="sm" aria-pressed="false">Slow-mo</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const WW=960,WH=540,BR=26,TAU=Math.PI*2,LIFE=.3;
const A={x:480,y:-60},P0={x:259,y:268};                 // anchor + start
const L=Math.hypot(P0.x-A.x,P0.y-A.y),th0=Math.atan2(P0.x-A.x,P0.y-A.y),thH=-th0,O={x:752,y:268},KB={x:Math.cos(-thH)*1100,y:-Math.sin(thH)*1100};
const tL=.35,tS=.75,tH=1.5,tRel=2.3,tBack=2.9,tEnd=3.3; // timeline (s)
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-(1-p)**3,eio=p=>p<.5?2*p*p:1-(-2*p+2)**2/2;
const pend=th=>({x:A.x+Math.sin(th)*L,y:A.y+Math.cos(th)*L});
const tang=th=>({x:Math.cos(th),y:-Math.sin(th)});

let dpr=1,sc=1,ox=0,oy=0,t=0,clock=0,ball,hook,ropeA,air,wave,ev;
let trail=[],parts=[],anims=[],shake=0,hitstop=0,tilt=0,stretch=1,ang=0,loop=true,slow=false;

function fit(){const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr|0;cv.height=r.height*dpr|0;sc=Math.min(r.width/WW,r.height/WH);ox=(r.width-WW*sc)/2;oy=(r.height-WH*sc)/2-14}
function reset(){t=0;trail=[];ev={a:0,h:0};ropeA=0;air=0;wave=0;ball={x:P0.x,y:P0.y};hook={x:P0.x,y:P0.y,a:0};stretch=1;ang=0;tilt=0}
function replay(){reset();parts=[];anims=[];shake=0}

const P=o=>{if(parts.length<800)parts.push({l:0,x:0,y:0,vx:0,vy:0,m:.5,k:0,c:'255,255,255',d:0,g:0,s:3,r:R(0,TAU),vr:0,...o})};
const anim=(dur,fn,under,delay=0)=>anims.push({t0:clock+delay,dur,fn,under});

/* ---------- shape fx ---------- */
function ring(x,y,r,u,c,lw){ctx.beginPath();ctx.arc(x,y,lerp(r*.1,r,eo(u)),0,TAU);ctx.lineWidth=lw*(1-u)+.5;ctx.strokeStyle=`rgba(${c},${(1-u)*.9})`;ctx.stroke()}
function cres(x,y,f,r0,b0,u){
  const e=eo(u),a=1-u*u,r=r0*(.55+.6*e),bg=b0*(.6+.7*e),k=lerp(.3,.85,u);
  ctx.save();ctx.translate(x,y);ctx.rotate(f);
  ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(bg*2,0,0,r);ctx.quadraticCurveTo(bg*2*k,0,0,-r);ctx.closePath();
  const g=ctx.createLinearGradient(0,0,bg,0);
  g.addColorStop(0,`rgba(255,120,20,${a*.4})`);g.addColorStop(.6,`rgba(255,248,225,${a})`);g.addColorStop(1,`rgba(255,170,60,${a*.35})`);
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(bg*2,0,0,r);ctx.lineWidth=2.5;ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.stroke();
  ctx.restore();
}
function splat(x,y,rad,pts,u){
  const e=eo(Math.min(u*5,1)),a=u<.5?1:1-(u-.5)*2,n=pts.length;
  ctx.beginPath();
  for(let i=0;i<n;i++){const an=i/n*TAU,r=rad*pts[i]*(.3+.7*e),px=x+Math.cos(an)*r,py=y+Math.sin(an)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.closePath();ctx.globalAlpha=a;ctx.fillStyle='#4a1a05';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#ffb44d';ctx.stroke();
}
function flash(x,y,u){
  const a=(1-u)**2,g=ctx.createRadialGradient(x,y,0,x,y,170);
  g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(.35,`rgba(255,170,70,${a*.5})`);g.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=g;ctx.fillRect(x-170,y-170,340,340);
}

/* ---------- events ---------- */
function anchorFx(){
  ev.a=1;shake=3;const ax=lerp(P0.x,A.x,(P0.y-14)/(P0.y-A.y)),ay=14;anim(.3,u=>ring(ax,ay,46,u,'255,200,120',4));
  for(let i=0;i<16;i++){const a=R(0,TAU),s=R(80,360);P({x:ax,y:ay,vx:Math.cos(a)*s,vy:Math.sin(a)*s,m:R(.2,.45),k:1,d:3,s:R(1.2,2.4),c:'255,220,160'})}
}
function burst(x,y,f){                       // reusable impact: position + travel angle
  shake=14;hitstop=.08;
  anim(.22,u=>flash(x,y,u));
  anim(.4,u=>ring(x,y,160,u,'255,190,100',8));
  anim(.36,u=>cres(x,y,f,150,85,u));
  anim(.32,u=>cres(x,y,f+.45,105,60,u),0,.04);
  anim(.34,u=>cres(x,y,f-.4,120,50,u),0,.07);
  const pts=Array.from({length:18},(_,i)=>R(i%2?.4:.95,i%2?.7:1.5));
  anim(.8,u=>splat(x,y,58,pts,u),1);
  for(let i=0;i<54;i++){const a=f+R(-1.5,1.5)*(Math.random()<.3?2.1:1),s=R(180,780);P({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,m:R(.25,.7),k:1,d:3.2,s:R(1.4,3.2),c:Math.random()<.5?'255,255,255':'255,190,100'})}
  for(let i=0;i<30;i++){const a=R(0,TAU),s=R(30,330);P({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,m:R(.4,.9),d:2,s:R(2,5),c:'255,150,50'})}
  for(let i=0;i<14;i++){const a=f+R(-1.8,1.8),s=R(150,480);P({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,m:R(.5,.9),k:2,d:1.2,g:520,s:R(5,10),vr:R(-12,12),c:'255,225,170'})}
}

/* ---------- simulation ---------- */
function step(dt){
  clock+=dt;
  if(t>=tEnd&&loop)reset();
  t=Math.min(t+dt,tEnd);
  stretch=1;ang=0;wave=0;
  const toA=()=>({x:A.x,y:A.y,a:Math.atan2(A.y-ball.y,A.x-ball.x)});
  if(t<tL){ball={x:P0.x,y:P0.y};hook={x:ball.x,y:ball.y,a:0};ropeA=0}
  else if(t<tS){                                                   // 1. launch
    const p=(t-tL)/(tS-tL),dx=A.x-P0.x,dy=A.y-P0.y,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d,k=Math.sin(p*Math.PI)*8;
    ball={x:P0.x-ux*k,y:P0.y-uy*k};
    hook={x:lerp(ball.x,A.x,eo(p)),y:lerp(ball.y,A.y,eo(p)),a:Math.atan2(dy,dx)};ropeA=1;wave=12*(1-p);
    for(let i=0;i<3;i++){const s=R(150,380);P({x:hook.x,y:hook.y,vx:-ux*s+R(-50,50),vy:-uy*s+R(-50,50),m:R(.15,.3),k:1,d:2,s:R(1.5,3),c:'255,190,100'})}
  }else if(t<tH){                                                  // 2. swing
    if(!ev.a)anchorFx();
    const p=(t-tS)/(tH-tS),th=th0+(thH-th0)*p**1.8,g=tang(th);
    ball=pend(th);hook=toA();ropeA=1;air=Math.min(1,p*4);
    stretch=1+.28*p;ang=Math.atan2(g.y,g.x);tilt=-.4*p;
    trail.push({x:ball.x,y:ball.y,t:clock,w:12+46*p});
    for(let i=0;i<2;i++)P({x:ball.x+R(-14,14),y:ball.y+R(-14,14),vx:-g.x*R(30,160),vy:-g.y*R(30,160),m:R(.2,.4),d:2,s:R(1.5,3.5),c:'255,190,100'});
  }else if(t<tRel){                                                // 3. impact + recoil
    const g=tang(thH),b=pend(thH);
    if(!ev.h){ev.h=1;burst((b.x+O.x)/2,(b.y+O.y)/2,Math.atan2(g.y,g.x));popup(O.x,O.y-50,Math.round(R(24,78)))}
    const u=t-tH,k=16*Math.exp(-9*u);
    ball={x:b.x-g.x*k,y:b.y-g.y*k};hook=toA();ropeA=1;air=1;{const f=foe();P({x:f.x,y:f.y,vx:R(-60,60),vy:R(-60,60),m:R(.3,.5),s:R(4,9),c:'255,190,130'})}tilt=-.4*Math.exp(-6*u);ang=Math.atan2(g.y,g.x);
  }else{                                                           // 4. release + return
    const q=cl((t-tRel)/(tBack-tRel)),e=eio(q),b=pend(thH);
    ball={x:lerp(b.x,P0.x,e),y:lerp(b.y,P0.y,e)-90*Math.sin(Math.PI*e)};
    air=1-e;ropeA=cl(1-(t-tRel)/.3);hook=toA();tilt*=Math.exp(-6*dt);
  }
  shake*=Math.exp(-12*dt);
  for(const p of parts){p.l+=dt;const k=Math.exp(-p.d*dt);p.vx*=k;p.vy=p.vy*k+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt}
  parts=parts.filter(p=>p.l<p.m);
  anims=anims.filter(a=>clock-a.t0<a.dur);
}

/* ---------- drawing ---------- */
const LAYERS=[
  [1,[[0,'rgba(255,120,20,.5)'],[.5,'rgba(255,90,10,.22)'],[1,'rgba(220,60,0,0)']]],
  [.6,[[0,'rgba(255,200,110,.85)'],[.6,'rgba(255,150,50,.3)'],[1,'rgba(255,110,20,0)']]],
  [.22,[[0,'rgba(255,255,255,1)'],[.7,'rgba(255,240,200,.45)'],[1,'rgba(255,255,255,0)']]]
];
function drawTrail(){
  trail=trail.filter(q=>clock-q.t<LIFE);
  const pts=trail;if(pts.length<2)return;
  const hd=pts[pts.length-1],tl=pts[0];
  ctx.globalCompositeOperation='lighter';
  const ga=(hd.w/58)*(1-(clock-hd.t)/LIFE)*.35,gg=ctx.createRadialGradient(ball.x,ball.y,0,ball.x,ball.y,75);
  gg.addColorStop(0,`rgba(255,150,40,${ga})`);gg.addColorStop(1,'rgba(255,100,0,0)');ctx.fillStyle=gg;ctx.fillRect(ball.x-75,ball.y-75,150,150);
  const edge=(k,side)=>pts.map(q=>{
    const f=1-(clock-q.t)/LIFE;let dx=q.x-A.x,dy=q.y-A.y;const d=Math.hypot(dx,dy)||1;
    const o=side>0?q.w*k*f**.7:-q.w*k*.3*f;return[q.x+dx/d*o,q.y+dy/d*o]});
  for(const [k,st] of LAYERS){
    const o=edge(k,1),n=edge(k,-1).reverse();
    ctx.beginPath();o.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));n.forEach(([x,y])=>ctx.lineTo(x,y));ctx.closePath();
    const g=ctx.createLinearGradient(hd.x,hd.y,tl.x,tl.y);st.forEach(([s,c])=>g.addColorStop(s,c));ctx.fillStyle=g;ctx.fill();
  }
  ctx.lineCap='round';ctx.lineWidth=1.6;
  for(const off of [8,18,30,44]){
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1],b=pts[i],fa=1-(clock-a.t)/LIFE,fb=1-(clock-b.t)/LIFE;
      const pa=A2(a,off*a.w/58*fa),pb=A2(b,off*b.w/58*fb);
      ctx.strokeStyle=`rgba(255,200,120,${fb*.5})`;ctx.beginPath();ctx.moveTo(pa[0],pa[1]);ctx.lineTo(pb[0],pb[1]);ctx.stroke();
    }
  }
}
function A2(q,o){const dx=q.x-A.x,dy=q.y-A.y,d=Math.hypot(dx,dy)||1;return[q.x+dx/d*o,q.y+dy/d*o]}

function drawRope(x0,y0,x1,y1,wv,al){
  if(al<=.01)return;
  const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,N=20,p=new Path2D();
  for(let i=0;i<=N;i++){const s=i/N,w=Math.sin(s*Math.PI)*wv*Math.sin(s*11-clock*38),x=x0+dx*s+nx*w,y=y0+dy*s+ny*w;i?p.lineTo(x,y):p.moveTo(x,y)}
  ctx.save();ctx.globalAlpha=al;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.lineWidth=6.5;ctx.strokeStyle='#1b120e';ctx.stroke(p);
  ctx.lineWidth=4;ctx.strokeStyle='#8f6040';ctx.stroke(p);
  ctx.lineWidth=2.4;ctx.strokeStyle='#d0a373';ctx.setLineDash([3,5]);ctx.stroke(p);
  ctx.restore();
}
function drawHook(x,y,a,al){
  if(al<=.01)return;
  const p=new Path2D();p.moveTo(-12,0);p.lineTo(5,0);p.arc(5,6,6,-Math.PI/2,Math.PI*.85);
  ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.rotate(a);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.lineWidth=7;ctx.strokeStyle='#0f1624';ctx.stroke(p);ctx.lineWidth=3.6;ctx.strokeStyle='#dbe6f4';ctx.stroke(p);
  ctx.restore();
}
function drawBall(){
  ctx.save();ctx.translate(ball.x,ball.y);
  ctx.save();ctx.rotate(ang);ctx.scale(stretch,1/Math.sqrt(stretch));
  ctx.beginPath();ctx.arc(0,0,BR,0,TAU);ctx.fillStyle='#f08a24';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle='#3a1a06';ctx.stroke();
  ctx.lineCap='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(120,40,0,.4)';ctx.beginPath();ctx.arc(0,0,BR-4,.1,1.6);ctx.stroke();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,225,170,.85)';ctx.beginPath();ctx.arc(0,0,BR-6.5,3.6,4.5);ctx.stroke();
  ctx.restore();
  ctx.rotate(tilt);ctx.translate(0,-BR*.78);
  const r=BR;
  ctx.beginPath();ctx.moveTo(-r*.8,r*.1);ctx.quadraticCurveTo(-r*.62,-r*.35,-r*.3,-r*.38);ctx.quadraticCurveTo(0,-r*.85,r*.3,-r*.38);
  ctx.quadraticCurveTo(r*.62,-r*.35,r*.8,r*.1);ctx.quadraticCurveTo(0,-r*.2,-r*.8,r*.1);ctx.closePath();
  ctx.fillStyle='#3a3248';ctx.fill();ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeStyle='#120d1a';ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*.65,r*.04);ctx.quadraticCurveTo(0,-r*.22,r*.65,r*.04);ctx.lineWidth=2;ctx.strokeStyle='#d6ac4c';ctx.stroke();
  ctx.restore();
}
function drawParts(){
  for(const p of parts){
    const f=1-p.l/p.m;
    if(p.k===0){ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(${p.c},${f*.8})`;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.4+.6*f),0,TAU);ctx.fill()}
    else if(p.k===1){ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(${p.c},${f})`;ctx.lineWidth=p.s*f+.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.04,p.y-p.vy*.04);ctx.stroke()}
    else{ctx.globalCompositeOperation='source-over';ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.beginPath();ctx.moveTo(p.s,0);ctx.lineTo(-p.s*.6,p.s*.5);ctx.lineTo(-p.s*.4,-p.s*.6);ctx.closePath();ctx.fillStyle=`rgba(${p.c},${f})`;ctx.fill();ctx.restore()}
  }
}
const STARS=Array.from({length:45},()=>[R(0,WW),R(0,280),R(.6,1.6),R(.3,.9)]);
function drawStage(){
  const g=ctx.createLinearGradient(0,0,0,WH);g.addColorStop(0,'#0e1428');g.addColorStop(.65,'#1c2a4c');g.addColorStop(1,'#2b3b62');
  ctx.fillStyle=g;ctx.fillRect(-30,-30,WW+60,WH+60);
  for(const [x,y,r,a] of STARS){ctx.fillStyle=`rgba(220,235,255,${a})`;ctx.fillRect(x,y,r,r)}
  ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#0a0e1c';
  ctx.beginPath();ctx.moveTo(200,400);ctx.lineTo(760,400);ctx.lineTo(690,486);ctx.lineTo(270,486);ctx.closePath();ctx.fillStyle='#2a3252';ctx.fill();ctx.stroke();
  ctx.fillStyle='#5f72a8';ctx.fillRect(200,400,560,10);
  for(const x of [160,650]){ctx.fillStyle='#6a7db4';ctx.beginPath();ctx.roundRect(x,294,150,12,4);ctx.fill();ctx.stroke();ctx.fillStyle='#a5b8ea';ctx.fillRect(x+4,295,142,2)}
}
function foe(){
  if(t<tH)return{x:O.x,y:O.y,rot:0,s:eo(cl(t/.25)),hurt:0};
  const u=t-tH,f=(1-Math.exp(-1.2*u))/1.2;
  return{x:O.x+KB.x*f,y:O.y+KB.y*f+300*u*u,rot:u*14,s:1,hurt:1};
}
function drawFoe(){
  const f=foe();ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.scale(f.s,f.s);
  ctx.beginPath();ctx.arc(0,0,BR,0,TAU);ctx.fillStyle='#3f8fd9';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle='#0c1a2e';ctx.stroke();
  ctx.lineCap='round';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,30,90,.35)';ctx.beginPath();ctx.arc(0,0,BR-4,.1,1.6);ctx.stroke();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(190,225,255,.8)';ctx.beginPath();ctx.arc(0,0,BR-6.5,3.6,4.5);ctx.stroke();
  ctx.strokeStyle='#0c1a2e';ctx.lineWidth=3;
  if(f.hurt){for(const x of [-8,8]){ctx.beginPath();ctx.moveTo(x-4,-8);ctx.lineTo(x+4,0);ctx.moveTo(x+4,-8);ctx.lineTo(x-4,0);ctx.stroke()}ctx.beginPath();ctx.arc(0,10,4,0,TAU);ctx.stroke()}
  else{
    ctx.fillStyle='#fff';for(const x of [-8,8]){ctx.beginPath();ctx.ellipse(x,-3,5,6.5,0,0,TAU);ctx.fill();ctx.lineWidth=2;ctx.stroke()}
    ctx.fillStyle='#0c1a2e';for(const x of [-9,7]){ctx.beginPath();ctx.arc(x,-2,2.4,0,TAU);ctx.fill()}
    ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,-13);ctx.lineTo(-4,-9);ctx.moveTo(14,-13);ctx.lineTo(4,-9);ctx.stroke();
  }
  ctx.restore();
}
function popup(x,y,v){anim(1.1,u=>{
  const sx=1+.5*(1-eo(Math.min(u*5,1)));
  ctx.globalAlpha=u<.7?1:1-(u-.7)/.3;ctx.translate(x,y-50*eo(u));ctx.scale(sx,sx);
  ctx.font='900 44px system-ui,sans-serif';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=8;ctx.strokeStyle='#14081a';
  ctx.strokeText(v+'%',0,0);ctx.fillStyle='#fff3ea';ctx.fillText(v+'%',0,0);
},1,.08)}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,ox*dpr,oy*dpr);ctx.save();ctx.beginPath();ctx.rect(0,0,WW,WH);ctx.clip();
  ctx.translate(R(-1,1)*shake,R(-1,1)*shake);drawStage();drawFoe();
  const run=list=>{for(const a of list){const u=(clock-a.t0)/a.dur;if(u<0||u>1)continue;ctx.save();ctx.globalCompositeOperation=a.under?'source-over':'lighter';a.fn(u);ctx.restore()}};
  run(anims.filter(a=>a.under));
  ctx.globalCompositeOperation='source-over';
  drawTrail();
  ctx.globalCompositeOperation='source-over';
  if(ropeA>0){drawRope(ball.x,ball.y,hook.x,hook.y,wave,ropeA);drawHook(hook.x,hook.y,hook.a,ropeA)}
  drawBall();
  drawParts();
  run(anims.filter(a=>!a.under));
  ctx.restore();
}

/* ---------- loop + controls ---------- */
let last=performance.now();
function frame(n){
  let dt=Math.min((n-last)/1000,.05);last=n;
  if(slow)dt*=.25;
  if(hitstop>0){hitstop-=dt;dt*=.06}
  step(dt);render();requestAnimationFrame(frame);
}
const tog=(id,fn)=>{const b=document.getElementById(id);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on)})};
document.getElementById('rp').addEventListener('click',replay);
tog('lp',v=>loop=v);tog('sm',v=>slow=v);
cv.addEventListener('pointerdown',replay);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();replay()}});
addEventListener('resize',fit);
fit();reset();requestAnimationFrame(frame);
</script>
</body>
