<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Toon Muzzle Effect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            user-select: none;
            overflow: hidden;
        }
        .toon-font {
            font-family: 'Bungee', cursive;
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="h-screen w-screen relative bg-slate-950 overflow-hidden flex flex-col justify-between">

    <!-- Interactive Canvas -->
    <canvas id="canvas" class="absolute inset-0 w-full h-full z-0 cursor-crosshair"></canvas>

    <!-- Minimal Helper Footer -->
    <footer class="relative z-10 p-4 text-center pointer-events-none">
        <span class="bg-slate-900/90 text-slate-300 text-xs font-semibold px-4 py-2 rounded-full border-2 border-black shadow-[2px_2px_0px_#000]">
            💡 Click anywhere or hold <kbd class="text-amber-400 font-bold">SPACE</kbd> to trigger FX
        </span>
    </footer>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mousePos = { x: width * 0.5, y: height * 0.5 };
        let isFiring = false;
        let fireCooldown = 0;

        // Active particles pool
        const particles = [];

        /**
         * Simple Toon Particle (Central Flash & Flying Spark Bits)
         */
        class ToonParticle {
            constructor(x, y, angle, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'flash' or 'spark'
                
                if (type === 'flash') {
                    this.life = 1.0;
                    this.decay = 0.25; // Dies fast in ~4 frames
                    this.scale = 45 + Math.random() * 15;
                    this.spikes = Math.floor(Math.random() * 3) + 6; // 6 to 8 spikes
                    this.rotation = angle;
                } else {
                    // Spark
                    this.life = 1.0;
                    this.decay = 0.1 + Math.random() * 0.08; // ~7-10 frames
                    const speed = 8 + Math.random() * 14;
                    const spread = (Math.random() - 0.5) * 0.8;
                    this.vx = Math.cos(angle + spread) * speed;
                    this.vy = Math.sin(angle + spread) * speed;
                    this.size = 6 + Math.random() * 6;
                }
            }

            update() {
                this.life -= this.decay;
                if (this.type === 'spark') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.88; // Fast air friction
                    this.vy *= 0.88;
                }
            }

            draw(ctx) {
                if (this.life <= 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'flash') {
                    ctx.rotate(this.rotation);
                    const s = this.scale * this.life;

                    // Outlined Toon Starburst
                    ctx.fillStyle = this.life > 0.5 ? '#ffffff' : '#fbbf24';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 3.5;
                    ctx.lineJoin = 'miter';

                    ctx.beginPath();
                    const step = (Math.PI * 2) / (this.spikes * 2);
                    for (let i = 0; i < this.spikes * 2; i++) {
                        const r = (i % 2 === 0) ? s : s * 0.35;
                        const a = i * step;
                        const px = Math.cos(a) * r;
                        const py = Math.sin(a) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    ctx.fill();

                    // Inner Hot Core
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'spark') {
                    const s = this.size * this.life;

                    ctx.fillStyle = '#f59e0b';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;

                    // Diamond/Triangle Toon Spark
                    ctx.beginPath();
                    ctx.arc(0, 0, s, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function spawnMuzzleEffect() {
            const muzzleX = mousePos.x;
            const muzzleY = mousePos.y;
            const flashAngle = Math.random() * Math.PI * 2;

            // 1. Central Toon Starburst
            particles.push(new ToonParticle(muzzleX, muzzleY, flashAngle, 'flash'));

            // 2. Radial Flying Toon Sparks (8-12 pieces)
            const sparkCount = Math.floor(Math.random() * 5) + 8;
            for (let i = 0; i < sparkCount; i++) {
                const sparkAngle = (Math.PI * 2 / sparkCount) * i + (Math.random() - 0.5) * 0.5;
                particles.push(new ToonParticle(muzzleX, muzzleY, sparkAngle, 'spark'));
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Continuous firing handle
            if (isFiring) {
                if (fireCooldown <= 0) {
                    spawnMuzzleEffect();
                    fireCooldown = 6; // Rate of fire frames
                } else {
                    fireCooldown--;
                }
            } else {
                fireCooldown = 0;
            }

            // Clear Canvas
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, width, height);

            // Background Grid Lines
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const grid = 50;
            for (let x = 0; x < width; x += grid) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += grid) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Draw Crosshair
            ctx.save();
            ctx.translate(mousePos.x, mousePos.y);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.moveTo(-14, 0); ctx.lineTo(-5, 0);
            ctx.moveTo(14, 0); ctx.lineTo(5, 0);
            ctx.moveTo(0, -14); ctx.lineTo(0, -5);
            ctx.moveTo(0, 14); ctx.lineTo(0, 5);
            ctx.stroke();
            ctx.restore();
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        window.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
        });

        window.addEventListener('pointerdown', () => {
            isFiring = true;
            spawnMuzzleEffect();
        });

        window.addEventListener('pointerup', () => isFiring = false);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                isFiring = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') isFiring = false;
        });

        // Start animation
        window.onload = () => animate();
    </script>
</body>
</html>
