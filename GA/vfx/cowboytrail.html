<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toon Bullet Trail FX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            user-select: none;
            overflow: hidden;
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="h-screen w-screen relative bg-slate-950 overflow-hidden flex flex-col justify-between">

    <canvas id="canvas" class="absolute inset-0 w-full h-full z-0 cursor-crosshair"></canvas>

    <!-- Minimal UI Footer -->
    <footer class="relative z-10 p-4 text-center pointer-events-none">
        <span class="bg-slate-900/90 text-slate-300 text-xs font-semibold px-4 py-2 rounded-full border-2 border-black shadow-[2px_2px_0px_#000]">
            ⚡ Click anywhere or hold <kbd class="text-yellow-400 font-bold">SPACE</kbd> to launch long toon bullet trails from the right circle to the left circle
        </span>
    </footer>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mousePos = { x: width * 0.5, y: height * 0.5 };
        let isFiring = false;
        let fireCooldown = 0;

        const bullets = [];
        const impacts = [];

        // Helper to get circle positions with increased distance
        function getCirclePositions() {
            const spacing = Math.min(width * 0.32, 280); // Increased distance between circles
            return {
                left: { x: width / 2 - spacing, y: height / 2 },
                right: { x: width / 2 + spacing, y: height / 2 }
            };
        }

        class ToonBullet {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;

                const dx = targetX - startX;
                const dy = targetY - startY;
                const dist = Math.hypot(dx, dy) || 1;

                this.speed = 36 + Math.random() * 4; 
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;

                this.angle = Math.atan2(dy, dx);
                this.trailLength = 220; // Extended long toon trail
                this.headRadius = 6.5;

                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = dist;
                this.traveled = 0;

                // Classic brass bullet & hot tracer palette
                this.color = '#f59e0b';
                this.coreColor = '#fffbeb';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.traveled += this.speed;

                if (this.traveled >= this.distanceToTarget) {
                    spawnImpact(this.targetX, this.targetY, this.angle);
                    return false; // Destroy bullet on hit
                }
                return true;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const len = Math.min(this.trailLength, this.traveled);

                // Outer Black Toon Outline for Bullet Trail
                ctx.beginPath();
                ctx.arc(0, 0, this.headRadius, -Math.PI / 2, Math.PI / 2, false); // Bullet head tip
                ctx.lineTo(-len, 1.2); // Tapering down to narrow tail
                ctx.lineTo(-len, -1.2);
                ctx.closePath();

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3.5;
                ctx.lineJoin = 'round';
                ctx.stroke();

                // Golden Brass Bullet Fill
                ctx.fillStyle = this.color;
                ctx.fill();

                // Inner Bright Tracer Core
                ctx.beginPath();
                ctx.arc(0, 0, this.headRadius * 0.5, -Math.PI / 2, Math.PI / 2, false);
                ctx.lineTo(-len * 0.7, 0.5);
                ctx.lineTo(-len * 0.7, -0.5);
                ctx.closePath();
                ctx.fillStyle = this.coreColor;
                ctx.fill();

                // Cartoon Speed Accent Lines
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, -this.headRadius - 3);
                ctx.lineTo(-len * 0.85, -this.headRadius - 3);
                ctx.moveTo(-6, this.headRadius + 3);
                ctx.lineTo(-len * 0.75, this.headRadius + 3);
                ctx.stroke();

                ctx.restore();
            }
        }

        class ToonImpact {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.color = '#fbbf24'; // Metallic brass/spark gold impact
                this.life = 1.0;
                this.decay = 0.18;
                this.maxSize = 18 + Math.random() * 6;
            }

            update() {
                this.life -= this.decay;
                return this.life > 0;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const size = this.maxSize * (1 - this.life * 0.2);

                // Starburst Spikes with Toon Outlines
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2.5;
                ctx.fillStyle = this.color;

                for (let i = 0; i < 4; i++) {
                    const a = (i * Math.PI / 2) + Math.PI / 4;
                    const r1 = size * 0.4;
                    const r2 = size * 1.2;

                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * r2, Math.sin(a) * r2, 2.5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fill();
                }

                // Core Impact Circle
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.restore();
            }
        }

        function spawnBullet() {
            const pos = getCirclePositions();
            // Bullet fires from the right circle to the left circle
            bullets.push(new ToonBullet(pos.right.x, pos.right.y, pos.left.x, pos.left.y));
        }

        function spawnImpact(x, y, angle) {
            impacts.push(new ToonImpact(x, y, angle));
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isFiring) {
                if (fireCooldown <= 0) {
                    spawnBullet();
                    fireCooldown = 4; // Firing cadence
                } else {
                    fireCooldown--;
                }
            } else {
                fireCooldown = 0;
            }

            // Clear Background
            ctx.fillStyle = '#0b0f19';
            ctx.fillRect(0, 0, width, height);

            // Subtle Background Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const grid = 50;
            for (let x = 0; x < width; x += grid) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += grid) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            // Draw 2 Emitter Circles in the Middle of the Screen (Wider Distance)
            const pos = getCirclePositions();

            // Left Circle (Target Port)
            ctx.save();
            ctx.translate(pos.left.x, pos.left.y);
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(0, 0, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Inner Target Disc
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(-6, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // Right Circle (Launcher aimed directly Left)
            ctx.save();
            ctx.translate(pos.right.x, pos.right.y);
            ctx.rotate(Math.PI); // Point launcher towards the left circle

            // Outer Toon Emitter Circle
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(0, 0, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Inner Barrel/Glowing Port
            ctx.fillStyle = isFiring ? '#ef4444' : '#facc15';
            ctx.beginPath();
            ctx.arc(8, 0, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // Update & Render Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (!b.update()) {
                    bullets.splice(i, 1);
                } else {
                    b.draw(ctx);
                }
            }

            // Update & Render Impacts
            for (let i = impacts.length - 1; i >= 0; i--) {
                const imp = impacts[i];
                if (!imp.update()) {
                    impacts.splice(i, 1);
                } else {
                    imp.draw(ctx);
                }
            }

            // Render Target Crosshair
            ctx.save();
            ctx.translate(mousePos.x, mousePos.y);
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.moveTo(-11, 0); ctx.lineTo(-4, 0);
            ctx.moveTo(11, 0); ctx.lineTo(4, 0);
            ctx.moveTo(0, -11); ctx.lineTo(0, -4);
            ctx.moveTo(0, 11); ctx.lineTo(0, 4);
            ctx.stroke();
            ctx.restore();
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        window.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
        });

        window.addEventListener('pointerdown', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
            isFiring = true;
            spawnBullet();
        });

        window.addEventListener('pointerup', () => isFiring = false);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                isFiring = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') isFiring = false;
        });

        window.onload = () => animate();
    </script>
</body>
</html>
